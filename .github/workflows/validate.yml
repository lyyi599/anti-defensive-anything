name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository consistency
        run: python3 scripts/validate.py
      - name: Shell script syntax
        run: bash -n scripts/install.sh
      - name: Install script smoke test
        run: |
          scripts/install.sh --target "$RUNNER_TEMP/skills"
          scripts/install.sh --target "$RUNNER_TEMP/partial" writing
          test -f "$RUNNER_TEMP/partial/anti-defensive/SKILL.md"
          test -f "$RUNNER_TEMP/partial/anti-defensive-writing/SKILL.md"
          ! scripts/install.sh --target "$RUNNER_TEMP/bad" no-such-scene
